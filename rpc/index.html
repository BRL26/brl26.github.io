<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>Trigger</title>
    <style>
        body {
            background-color: #121212;
            color: #eeeeee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #5865F2; margin-top: 0; }
        p { color: #a0a0a0; margin-bottom: 0; }
    </style>
    <!-- Ably API key used by the browser to publish the trigger.
         For best practice use a publish-only restricted key. -->
    <meta name="ably-key" content="DiiOVQ.BFojtQ:R1TGzlnlj2NEZlhj-27RlzYWlZp0XQmj3R0QFxa6H58">
    <meta name="ably-channel" content="rpc-trigger">
</head>
<body>
    <div class="card">
        <h2>Triggering...</h2>
        <p id="status">Contacting PC...</p>
    </div>
    <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
    <script>
        var ablyKey = document.querySelector('meta[name="ably-key"]').content;
        var ablyChannel = document.querySelector('meta[name="ably-channel"]').content;
        var status = document.getElementById('status');

        var done = false;
        function finish(text) {
            if (done) return;
            done = true;
            status.textContent = text;
            setTimeout(function () {
                try { window.close(); } catch (e) {}
            }, 400);
        }

        var realtime = new Ably.Realtime({ key: ablyKey, clientId: 'trigger-page' });

        realtime.connection.once('connected', function () {
            var channel = realtime.channels.get(ablyChannel);
            channel.publish('trigger', { t: Date.now() }, function (err) {
                if (err) finish('Trigger failed: ' + err.message);
                else finish('Command triggered!');
                realtime.close();
            });
        });

        realtime.connection.once('failed', function (err) {
            finish('Could not reach relay: ' + err.message);
        });
    </script>
</body>
</html>
